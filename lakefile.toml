name = "CompactCheck"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CompactCheck"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # Mathlib's copyright-header check, meant for Mathlib's own files
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "CompactCheck"

[[lean_exe]]
name = "compactcheck"
root = "Main"
